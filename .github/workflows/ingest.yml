name: Data Pipeline (hourly)

on:
  schedule:
    - cron: "0 * * * *"      # tiap jam, menit ke-0 (UTC)
  workflow_dispatch:          # bisa dijalankan manual

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false   # run yang menumpuk antre, tidak saling membatalkan

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (ingest -> clean -> features)
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python src/data/run_pipeline.py

      - name: Commit data
        run: |
          git config user.name "predictacoin-bot"
          git config user.email "predictacoin-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "data: ingest $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
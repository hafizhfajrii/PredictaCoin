# Konfigurasi utama proyek PredictaCoin
# Sistem Prediksi Harga & Deteksi Anomali Cryptocurrency dengan Continual Learning

data:
  source: "coingecko_api"
  assets: ["bitcoin", "ethereum"]
  fetch_interval_hours: 1
  history_window_days: 90   
  incremental_days: 2        
  raw_path: "data/raw"
  interim_path: "data/interim"
  processed_path: "data/processed"

# LK-04: opsi ingestion
ingestion:
  snapshot_enabled: true                # simpan JSON mentah ber-timestamp tiap run
  snapshot_path: "data/raw/snapshots"
  snapshot_retention_days: 7            # 0 = simpan semua snapshot

# LK-04: parameter preprocessing
preprocessing:
  max_ffill_hours: 3                    # gap > 3 jam tidak diisi
  outlier_window_hours: 168             # jendela robust z-score (7 hari)
  outlier_z_threshold: 5.0

labeling:
  horizon_hours: 1
  threshold_up_pct: 0.2
  threshold_down_pct: -0.2

model:
  task: "multiclass_classification"
  classes: ["Naik", "Turun", "Stabil"]
  registry_path: "models"
  primary_model: "xgboost"
  baseline_model: "logistic_regression"
  calibration: "isotonic"      
  validation_strategy: "walk_forward"  

anomaly_detection:
  method: "isolation_forest"   
  contamination: 0.02

continual_learning:
  scheduled_retrain_hours: 24
  performance_drop_threshold_pct: 10
  drift_metric: "PSI"
  anomaly_trigger_min_count: 3   
  anomaly_trigger_window_hours: 6  
